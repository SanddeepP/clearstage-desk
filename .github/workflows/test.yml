name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y postgresql-client >/dev/null
      - run: scripts/db-test.sh
  browser:
    # Live sign-in path against a fake Supabase client (bugs of 25 Nov). Playwright is installed here only, not in package.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: (python3 -m http.server 8795 >/dev/null 2>&1 &) && sleep 1 && node tests/browser/live-auth.cjs && node tests/browser/modules.cjs && node tests/browser/roles.cjs
